<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер JSON — Lappavel.ru</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Подключаем общие стили сайта -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Локальные стили только для элементов конвертера -->
    <style>
        /* Адаптация контейнера под layout сайта */
        .converter-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Карточка вокруг всего инструмента */
        .tool-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 30px;
        }

        h2.tool-title {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #f4f6f9;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            resize: vertical;
            transition: border-color 0.2s;
            background-color: #fafafa;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Переопределяем стандартные кнопки сайта для этого блока */
        button.action-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        button.action-btn:hover {
            background-color: #2980b9;
        }

        button.secondary-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
        }

        button.secondary-btn:hover {
            background-color: #dde4e6;
        }

        #status {
            font-size: 0.9rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-error { color: #e74c3c; }
        .status-success { color: #2ecc71; }

        .output-wrapper {
            position: relative;
            margin-top: 20px;
        }

        /* Индикатор копирования в углу поля вывода */
        .copy-indicator {
            position: absolute;
            right: 15px;
            top: 45px; /* Смещение вниз от лейбла */
            font-size: 0.8rem;
            color: #2ecc71;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .copy-indicator.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

<!-- ОБЩАЯ ШАПКА САЙТА -->
<header>
    <div class="header-inner">
        <a href="/" class="logo">
            <img src="/favicon.svg" alt="Логотип">
        </a>
        <nav>
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/windows.html">Все для Windows</a></li>
                <li><a href="/linux.html">Все для Linux</a></li>
                <li><a href="/pc-config.html">Конфигурация ПК</a></li>
                <li><a href="/lic-scheta.html">ЛС</a></li>
                <li><a href="/converter.html" class="active">Конвертер JSON</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container converter-container">

    <div class="tool-card">
        <h2 class="tool-title">🔄 Конвертер JSON → VLESS / Hysteria 2</h2>

        <div style="margin-bottom: 20px;">
            <label for="jsonInput">Входные данные (JSON конфиг):</label>
            <textarea id="jsonInput" placeholder='Вставьте сюда содержимое JSON-файла...'></textarea>
        </div>

        <div class="button-group">
            <button id="convertBtn" class="action-btn">Конвертировать</button>
            <button id="clearBtn" class="secondary-btn action-btn">Очистить</button>
            <span id="status"></span>
        </div>

        <div class="output-wrapper">
            <label for="linkOutput">Результат (Share-ссылка):</label>
            <textarea id="linkOutput" readonly placeholder="Здесь появится сгенерированная ссылка..."></textarea>
            <span id="copyIndicator" class="copy-indicator">Скопировано!</span>
        </div>

        <div class="button-group">
            <button id="copyBtn" class="secondary-btn action-btn">Скопировать ссылку</button>
            <button id="copyConfigBtn" class="secondary-btn action-btn">Копировать имя + ссылку</button>
        </div>
    </div>

</main>

<!-- ОБЩИЙ ПОДВАЛ САЙТА -->
<footer>
    <p>&copy; 2026 Lappavel.ru. Все права защищены.</p>
</footer>

<script>
    const jsonInput = document.getElementById('jsonInput');
    const linkOutput = document.getElementById('linkOutput');
    const convertBtn = document.getElementById('convertBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyConfigBtn = document.getElementById('copyConfigBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status = document.getElementById('status');
    const copyIndicator = document.getElementById('copyIndicator');

    let currentRemark = '';

    function setStatus(message, isError = false) {
        status.textContent = message;
        status.className = isError ? 'status-error' : 'status-success';
    }

    function clearStatus() {
        status.textContent = '';
        status.className = '';
    }

    convertBtn.addEventListener('click', () => {
        clearStatus();
        const rawJson = jsonInput.value.trim();

        if (!rawJson) {
            setStatus('Ошибка: Поле ввода пустое.', true);
            return;
        }

        let config;
        try {
            config = JSON.parse(rawJson);
        } catch (e) {
            setStatus('Ошибка: Невалидный JSON формат. Проверьте синтаксис.', true);
            return;
        }

        const outbound = config.outbounds?.find(out => ['vless', 'hysteria'].includes(out.protocol));
        if (!outbound) {
            setStatus('Ошибка: Поддерживаются только протоколы "vless" или "hysteria".', true);
            return;
        }

        const protocol = outbound.protocol;
        currentRemark = config.remarks || config.name || `${protocol.toUpperCase()}_Config`;
        const remarkEncoded = encodeURIComponent(currentRemark);

        let finalLink = '';

        if (protocol === 'vless') {
            const vnext = outbound.settings?.vnext?.[0];
            if (!vnext || !vnext.users?.[0]) {
                setStatus('Ошибка: Неверная структура VLESS (отсутствует vnext или users).', true);
                return;
            }

            const user = vnext.users[0];
            const stream = outbound.streamSettings || {};
            const security = stream.security || 'none';
            const params = new URLSearchParams();

            params.append('type', stream.network || 'tcp');
            params.append('security', security);

            if (security === 'reality' || security === 'tls') {
                const secSettings = stream[`${security}Settings`] || {};
                if (secSettings.serverName) params.append('sni', secSettings.serverName);
                if (security === 'reality') {
                    if (secSettings.publicKey) params.append('pbk', secSettings.publicKey);
                    if (secSettings.shortId) params.append('sid', secSettings.shortId);
                    if (secSettings.spiderX) params.append('spx', secSettings.spiderX);
                    if (secSettings.fingerprint) params.append('fp', secSettings.fingerprint);
                }
            }

            if (user.flow) params.append('flow', user.flow);

            ['sockopt', 'tcpSettings', 'wsSettings', 'grpcSettings', 'httpupgradeSettings'].forEach(key => {
                if (stream[key] && Object.keys(stream[key]).length > 0) {
                    params.append(key, JSON.stringify(stream[key]));
                }
            });

            const queryString = params.toString().replace(/\+/g, '%20');
            finalLink = `vless://${user.id}@${vnext.address}:${vnext.port}?${queryString}#${remarkEncoded}`;

        } else if (protocol === 'hysteria') {
            const address = outbound.settings?.address;
            const port = outbound.settings?.port;
            // Auth может быть в settings или в streamSettings.hysteriaSettings
            const auth = outbound.streamSettings?.hysteriaSettings?.auth || outbound.settings?.auth || '';
            const tlsSettings = outbound.streamSettings?.tlsSettings || {};

            if (!address || !port) {
                setStatus('Ошибка: Неверная структура Hysteria (отсутствует address или port).', true);
                return;
            }

            const params = new URLSearchParams();
            if (tlsSettings.serverName) params.append('sni', tlsSettings.serverName);
            if (tlsSettings.alpn && tlsSettings.alpn.length > 0) params.append('alpn', tlsSettings.alpn[0]);

            const queryString = params.toString().replace(/\+/g, '%20');
            finalLink = `hy2://${auth}@${address}:${port}?${queryString}#${remarkEncoded}`;
        }

        linkOutput.value = finalLink;
        setStatus(`Конвертация ${protocol.toUpperCase()} успешно завершена.`);
    });

    function showCopyFeedback(buttonElement) {
        copyIndicator.classList.add('visible');
        const originalText = buttonElement.textContent;
        buttonElement.textContent = '✅ Готово!';
        setTimeout(() => {
            copyIndicator.classList.remove('visible');
            buttonElement.textContent = originalText;
        }, 2000);
    }

    copyBtn.addEventListener('click', async () => {
        const textToCopy = linkOutput.value.trim();
        if (!textToCopy) {
            setStatus('Нечего копировать: поле вывода пустое.', true);
            return;
        }
        try {
            await navigator.clipboard.writeText(textToCopy);
            showCopyFeedback(copyBtn);
            clearStatus();
        } catch (err) {
            setStatus('Ошибка при копировании в буфер обмена.', true);
        }
    });

    copyConfigBtn.addEventListener('click', async () => {
        const linkText = linkOutput.value.trim();
        if (!linkText || !currentRemark) {
            setStatus('Сначала выполните успешную конвертацию.', true);
            return;
        }
        const textToCopy = `${currentRemark}\n${linkText}`;
        try {
            await navigator.clipboard.writeText(textToCopy);
            showCopyFeedback(copyConfigBtn);
            clearStatus();
        } catch (err) {
            setStatus('Ошибка при копировании в буфер обмена.', true);
        }
    });

    clearBtn.addEventListener('click', () => {
        jsonInput.value = '';
        linkOutput.value = '';
        currentRemark = '';
        clearStatus();
        jsonInput.focus();
    });
</script>

</body>
</html>
